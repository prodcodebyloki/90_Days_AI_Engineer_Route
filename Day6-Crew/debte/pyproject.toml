[project]
name = "debte"
version = "0.1.0"
description = "debte using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
debte = "debte.main:run"
run_crew = "debte.main:run"
train = "debte.main:train"
replay = "debte.main:replay"
test = "debte.main:test"
run_with_trigger = "debte.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
constraint-dependencies = [
    "onnxruntime<1.26.0",
]
